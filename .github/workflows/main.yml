name: Enterprise CI Pipeline

# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

      deploy_tests:
        description: "Run integration tests?"
        required: false
        default: true
        type: boolean


# ============================================================
# DEFAULT PERMISSIONS
# ============================================================
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write


# ============================================================
# CONCURRENCY
# Prevent duplicate builds for the same branch
# ============================================================
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================
env:
  NODE_VERSION: "22"
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/zomato_new
  IMAGE_TAG: ${{ github.sha }}


jobs:

  # ==========================================================
  # JOB 1: BUILD REACT APPLICATION
  # ==========================================================
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT CODE
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. SETUP NODE.JS + NPM CACHE
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      # ------------------------------------------------------
      # 3. DISPLAY VERSIONS
      # ------------------------------------------------------
      - name: Display Versions
        run: |
          node --version
          npm --version


      # ------------------------------------------------------
      # 4. INITIALIZE CODEQL
      # ------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript


      # ------------------------------------------------------
      # 5. INSTALL DEPENDENCIES
      # ------------------------------------------------------
      - name: Install Dependencies
        run: npm ci


      # ------------------------------------------------------
      # 6. VERIFY DEPENDENCIES
      # ------------------------------------------------------
      - name: Verify Installed Packages
        run: npm ls || true


      # ------------------------------------------------------
      # 7. LINT
      # ------------------------------------------------------
      - name: Run ESLint
        run: npm run lint


      # ------------------------------------------------------
      # 8. UNIT TEST
      # ------------------------------------------------------
      - name: Run Unit Tests
        env:
          CI: true
        run: npm test -- --watchAll=false


      # ------------------------------------------------------
      # 9. BUILD REACT APPLICATION
      # ------------------------------------------------------
      - name: Build Application
        run: npm run build


      # ------------------------------------------------------
      # 10. CODEQL ANALYSIS
      # ------------------------------------------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


      # ------------------------------------------------------
      # 11. UPLOAD REACT BUILD ARTIFACT
      # ------------------------------------------------------
      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          if-no-files-found: error


  # ==========================================================
  # JOB 2: SECURITY + DOCKER IMAGE
  # ==========================================================
  security:
    name: Security & Docker Image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT CODE
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. DOWNLOAD ARTIFACT FROM JOB 1
      # ------------------------------------------------------
      - name: Download React Build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build/


      # ------------------------------------------------------
      # 3. VERIFY ARTIFACT
      # ------------------------------------------------------
      - name: Verify React Build
        run: |
          echo "React build contents:"
          ls -la build/
          du -sh build/


      # ------------------------------------------------------
      # 4. INSTALL TRIVY
      # ------------------------------------------------------
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241


      # ------------------------------------------------------
      # 5. VERIFY TRIVY
      # ------------------------------------------------------
      - name: Verify Trivy
        run: trivy --version


      # ------------------------------------------------------
      # 6. TRIVY FILESYSTEM SCAN
      # ------------------------------------------------------
      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            .


      # ------------------------------------------------------
      # 7. VERIFY TRIVY REPORT
      # ------------------------------------------------------
      - name: Verify SARIF
        run: |
          pwd
          ls -la
          find . -name "*.sarif"


      # ------------------------------------------------------
      # 8. UPLOAD TRIVY RESULTS TO GITHUB
      # ------------------------------------------------------
      - name: Upload Trivy Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./trivy-fs.sarif


      # ------------------------------------------------------
      # 9. DOCKERFILE LINT
      # ------------------------------------------------------
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning


      # ------------------------------------------------------
      # 10. SETUP DOCKER BUILDX
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # 11. RESTORE DOCKER BUILD CACHE
      # ------------------------------------------------------
      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-


      # ------------------------------------------------------
      # 12. BUILD DOCKER IMAGE
      # ------------------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile

          push: false

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

          load: true
          provenance: false

          labels: |
            org.opencontainers.image.title=Zomato
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}


      # ------------------------------------------------------
      # 13. UPDATE DOCKER CACHE
      # ------------------------------------------------------
      - name: Update Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache


      # ------------------------------------------------------
      # 14. VERIFY DOCKER IMAGE
      # ------------------------------------------------------
      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


      # ------------------------------------------------------
      # 15. LOGIN TO DOCKER HUB
      # ------------------------------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ------------------------------------------------------
      # 16. PUSH IMAGE TO DOCKER HUB
      # ------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest


      # ------------------------------------------------------
      # 17. SMOKE TEST
      # ------------------------------------------------------
      - name: Smoke Test Container
        run: |
          docker run -d \
            --name zomato-test \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          sleep 20

          docker ps

          docker logs zomato-test


      # ------------------------------------------------------
      # 18. CLEANUP
      # ------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker rm -f zomato-test || true
