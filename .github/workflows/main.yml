name: Enterprise CI Pipeline

# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

      deploy_tests:
        description: "Run integration tests?"
        required: false
        default: true
        type: boolean


# ============================================================
# DEFAULT PERMISSIONS
# ============================================================
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write


# ============================================================
# CONCURRENCY
# Cancel older build when a new build starts
# ============================================================
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false


# ============================================================
# GLOBAL VARIABLES
# ============================================================
env:
  NODE_VERSION: "20"
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/zomato_new
  IMAGE_TAG: ${{ github.sha }}


jobs:

  # ==========================================================
  # JOB 1: BUILD REACT APPLICATION
  # ==========================================================
  build:
    name: Build React Application
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v7


      # ------------------------------------------------------
      # 2. SETUP NODE + NPM CACHE
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      # ------------------------------------------------------
      # 3. VERIFY VERSIONS
      # ------------------------------------------------------
      - name: Display Versions
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version


      # ------------------------------------------------------
      # 4. CODEQL INITIALIZATION
      # ------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript


      # ------------------------------------------------------
      # 5. INSTALL DEPENDENCIES
      # ------------------------------------------------------
      - name: Install Dependencies
        run: npm ci


      # ------------------------------------------------------
      # 6. VERIFY DEPENDENCIES
      # ------------------------------------------------------
      - name: Verify Installed Packages
        run: npm ls --depth=0


      # ------------------------------------------------------
      # 7. ESLINT
      # ------------------------------------------------------
      - name: Run ESLint
        run: npm run lint


      # ------------------------------------------------------
      # 8. UNIT TESTS
      # ------------------------------------------------------
      - name: Run Unit Tests
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests


      # ------------------------------------------------------
      # 9. BUILD REACT APPLICATION
      # ------------------------------------------------------
      - name: Build Application
        run: npm run build


      # ------------------------------------------------------
      # 10. CODEQL ANALYSIS
      # ------------------------------------------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4


      # ------------------------------------------------------
      # 11. VERIFY BUILD
      # ------------------------------------------------------
      - name: Verify React Build
        run: |
          echo "Build directory:"
          ls -la build/

          echo "Build size:"
          du -sh build/


      # ------------------------------------------------------
      # 12. UPLOAD BUILD ARTIFACT
      # ------------------------------------------------------
      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          if-no-files-found: error
          retention-days: 7


  # ==========================================================
  # JOB 2: SECURITY + DOCKER IMAGE
  # ==========================================================
  security:
    name: Security & Docker Image
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v7


      # ------------------------------------------------------
      # 2. DOWNLOAD ARTIFACT FROM JOB 1
      # ------------------------------------------------------
      - name: Download React Build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build/


      # ------------------------------------------------------
      # 3. VERIFY ARTIFACT
      # ------------------------------------------------------
      - name: Verify React Build
        run: |
          echo "Downloaded React build:"
          ls -la build/
          du -sh build/


      # ------------------------------------------------------
      # 4. INSTALL TRIVY
      # ------------------------------------------------------
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241


      # ------------------------------------------------------
      # 5. VERIFY TRIVY
      # ------------------------------------------------------
      - name: Verify Trivy
        run: trivy --version


      # ------------------------------------------------------
      # 6. TRIVY FILESYSTEM SCAN
      # ------------------------------------------------------
      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            .


      # ------------------------------------------------------
      # 7. UPLOAD TRIVY SARIF
      # ------------------------------------------------------
      - name: Upload Trivy Scan Results
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem


      # ------------------------------------------------------
      # 8. DOCKERFILE LINT
      # ------------------------------------------------------
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning


      # ------------------------------------------------------
      # 9. SETUP DOCKER BUILDX
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # 10. RESTORE DOCKER CACHE
      # ------------------------------------------------------
      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-


      # ------------------------------------------------------
      # 11. BUILD DOCKER IMAGE
      # ------------------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile

          push: false
          load: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=local,src=/tmp/.buildx-cache

          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

          provenance: false

          labels: |
            org.opencontainers.image.title=Zomato
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}


      # ------------------------------------------------------
      # 12. UPDATE DOCKER CACHE
      # ------------------------------------------------------
      - name: Update Docker Cache
        if: always()
        run: |
          if [ -d "/tmp/.buildx-cache-new" ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi


      # ------------------------------------------------------
      # 13. VERIFY DOCKER IMAGE
      # ------------------------------------------------------
      - name: Verify Docker Image
        run: |
          echo "Docker images:"
          docker images

          echo "Inspecting image:"
          docker image inspect \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


      # ------------------------------------------------------
      # 14. LOGIN TO DOCKER HUB
      # ------------------------------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ------------------------------------------------------
      # 15. PUSH IMAGE
      # ------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ env.IMAGE_NAME }}:latest


      # ------------------------------------------------------
      # 16. SMOKE TEST
      # ------------------------------------------------------
      - name: Smoke Test Container
        run: |
          docker run -d \
            --name zomato-test \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          echo "Waiting for application..."
          sleep 20

          echo "Container status:"
          docker ps -a

          echo "Container logs:"
          docker logs zomato-test

          echo "Testing application:"
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost:3000


      # ------------------------------------------------------
      # 17. CLEANUP
      # ------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker rm -f zomato-test || true
